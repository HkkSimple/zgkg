                - heading "步骤 3：开始编译（核心 Prompt 模板）" [level=3] [ref=e245]
                - paragraph [ref=e246]: 每次加新资料时，把下面 Prompt 发给 LLM（Claude/Cursor 最佳）：
                - blockquote [ref=e247]:
                  - text: “你现在是我的个人知识库管理员。我的 wiki 位于 ./wiki/ 目录，raw/ 里有新文档
                  - code [ref=e248]: xxx.md
                  - text: 。
                  - text: 请按以下规则增量编译：
                - list [ref=e249]:
                  - listitem [ref=e250]: 读取 raw/xxx.md 并总结关键内容
                  - listitem [ref=e251]: 提取 3-8 个核心概念，检查是否已有对应文章
                  - listitem [ref=e252]: 更新或新建 concepts/ 下的文章，加入 backlinks
                  - listitem [ref=e253]: 更新 index.md 和所有相关索引
                  - listitem [ref=e254]:
                    - text: 输出所有需要修改/新建的文件完整内容
                    - text: 保持风格一致、链接准确。”
                - paragraph [ref=e255]:
                  - text: LLM 会直接输出多个
                  - code [ref=e256]: .md
                  - text: 文件，你复制进对应目录即可（或让 Cursor 直接写文件）。
                - heading "步骤 4：日常使用闭环" [level=3] [ref=e257]
                - list [ref=e258]:
                  - listitem [ref=e259]: • 提问：直接把问题 + “参考 wiki/ 目录下所有内容” 扔给 LLM。
                  - listitem [ref=e260]: • 输出归档：让 LLM 把答案生成 Markdown 或 Marp 幻灯片，再让它“归档到 wiki/”。
                  - listitem [ref=e261]: • 定期维护：每周让 LLM 跑一次 linting： > “对整个 wiki 做健康检查：找矛盾、缺失、潜在新连接，并建议 3 个新文章主题。”
                - heading "步骤 5：进阶技巧（很多人已经在用）" [level=3] [ref=e262]
                - list [ref=e263]:
                  - listitem [ref=e264]: • 自动捕获：用 Obsidian Web Clipper + 手机快捷键把日常阅读、聊天记录、PDF 自动扔进 raw/。
                  - listitem [ref=e265]: • 搜索增强：vibe code 一个简单本地搜索（或用 Obsidian 自带 + 插件）。
                  - listitem [ref=e266]: • 多主题隔离：不同研究方向建不同子文件夹，避免污染。
                  - listitem [ref=e267]: • 语音/跑步模式（Lex Fridman 做法）：让 LLM 基于当前 wiki 生成一个临时 mini-knowledge-base，用语音模式边跑步边对话。
                - heading "3. 常见坑 & 建议" [level=3] [ref=e268]
                - list [ref=e269]:
                  - listitem [ref=e270]: • 从小主题开始：先做一个 10 篇文章的小 wiki，熟悉流程，再扩大。
                  - listitem [ref=e271]: • 防止污染：很多人建议“个人 vault（高信号）” 和 “agent vault（实验区）” 分开，只把高质量输出手动搬进来。
                  - listitem [ref=e272]: • 工具链：Obsidian + Claude/Cursor 是目前最强组合，几乎零成本。
                  - listitem [ref=e273]: • 产品化趋势：Karpathy 说“这里有空间做一个了不起的新产品”，目前大家都在用“脚本 + Obsidian”的 hacky 方式，但很快会有更丝滑的一键工具出现。
                - paragraph [ref=e274]: 照着上面做，你就能在几天内拥有一个会自己生长、自己纠错、自己回答复杂问题的个人知识系统——这正是 Karpathy 最近把大量 token 从“写代码”转向“管理知识”的原因。
